name: Auto Format PHP

on:
  pull_request:
    paths:
    - '**.php'
    - 'cs2pr'

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    # dont run on forks. requires commit access
    if: github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      with:
        ref: ${{ github.head_ref }}

    - name: Setup PHP
      uses: shivammathur/setup-php@c77c69f5c8897d89fe313f4b6dd4d768d6a1b3db # v2
      with:
        php-version: 7.0
        coverage: none # disable xdebug, pcov
        tools: cs2pr
        
    - name: "Install dependencies with composer"
      run: "composer install --no-interaction --no-progress --no-suggest"

    - name: "Run friendsofphp/php-cs-fixer"
      run: "vendor/bin/php-cs-fixer fix --config=.php_cs --diff --diff-format=udiff --verbose"

    - uses: stefanzweifel/git-auto-commit-action@6d7a33192ef1f82f6e4141bc1199880a4651ec13 # v2.5.0
      with:
        commit_message: Apply php-cs-fixer changes
        branch: ${{ github.head_ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.STAABM_TOKEN }}
        
    - run: vendor/bin/php-cs-fixer fix --diff --dry-run --format=checkstyle | cs2pr # check whether there are still errors left
